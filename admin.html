<!DOCTYPE html>

<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baby Shower RSVP Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:linear-gradient(135deg,#fff7fa,#f2f6ff);font-family:"DM Sans",sans-serif;color:#504852}.wrap{width:min(1050px,94vw);margin:45px auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.head h1{font:600 3.6rem "Cormorant Garamond",serif;color:#3e587e;margin:0}.muted{color:#7b7380}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:28px 0}.stat{background:#fff;border:1px solid #f0dce2;border-radius:20px;padding:22px;box-shadow:0 12px 30px #6d5d6b0c}.stat b{font-size:2rem;color:#df6685}.card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 15px 35px #6d5d6b12}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.filters button{border:1px solid #cbd8ec;background:#f7faff;padding:9px 14px;border-radius:12px;cursor:pointer}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #eee}.yes{color:#a83d5c;font-weight:700}.no{color:#3e587e;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{display:block}.head h1{font-size:2.8rem}}
</style></head>
<body><div class="wrap">
<div class="head"><div><p class="muted">Private host dashboard</p><h1>Baby Shower RSVPs ♡</h1></div><button id="refresh">Refresh</button></div>
<div class="grid"><div class="stat"><span>Coming</span><br><b id="yes">0</b></div><div class="stat"><span>Not coming</span><br><b id="no">0</b></div><div class="stat"><span>Families responded</span><br><b id="families">0</b></div></div>
<div class="card"><h2>Family summary</h2><div id="summary">Loading…</div></div><br>
<div class="card"><h2>Individual responses</h2><table class="table"><thead><tr><th>Family</th><th>Guest</th><th>Response</th><th>Submitted by</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div>
<p style="text-align:center;color:#7b7380;font-size:.7rem;margin-top:22px">© 2026 Parth Rana. All rights reserved.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const db=(SITE_CONFIG.supabaseUrl.startsWith("http")&&!SITE_CONFIG.supabaseUrl.includes("TODO"))?supabase.createClient(SITE_CONFIG.supabaseUrl,SITE_CONFIG.supabaseAnonKey):null;
async function load(){
 if(!db){document.getElementById("summary").textContent="Connect Supabase in config.js first.";return}
 const {data,error}=await db.from("rsvps").select("*").order("family_name").order("guest_name");
 if(error){document.getElementById("summary").textContent="Unable to load RSVPs. Check your Supabase setup.";console.error(error);return}
 const yes=data.filter(x=>x.response==="yes"),no=data.filter(x=>x.response==="no");
 document.getElementById("yes").textContent=yes.length;document.getElementById("no").textContent=no.length;
 document.getElementById("families").textContent=new Set(data.map(x=>x.family_id)).size;
 const families={};data.forEach(x=>(families[x.family_id]??={name:x.family_name,yes:[],no:[]})[x.response].push(x.guest_name));
 document.getElementById("summary").innerHTML=Object.values(families).map(f=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><b>${f.name}</b><br><span class="yes">Coming: ${f.yes.join(", ")||"None"}</span><br><span class="no">Not coming: ${f.no.join(", ")||"None"}</span></div>`).join("")||"No RSVPs yet.";
 document.getElementById("rows").innerHTML=data.map(x=>`<tr><td>${x.family_name}</td><td>${x.guest_name}</td><td class="${x.response==="yes"?"yes":"no"}">${x.response.toUpperCase()}</td><td>${x.submitted_by||""}</td><td>${new Date(x.updated_at||x.created_at).toLocaleString()}</td></tr>`).join("");
}
document.getElementById("refresh").onclick=load;load();
</script></body></html>
