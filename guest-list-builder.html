<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guest List Builder — Baby Shower</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#df6685;--pink-dark:#a83d5c;--blue:#718fbd;--blue-dark:#3e587e;--cream:#fffdf8;--ink:#504852;--muted:#7b7380}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fff7fa,#f2f6ff);font-family:"DM Sans",sans-serif;color:var(--ink)}
.wrap{width:min(760px,94vw);margin:40px auto 70px}
h1{font:600 2.6rem "Cormorant Garamond",serif;color:var(--blue-dark);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 26px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 15px 35px #6d5d6b12;margin-bottom:20px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;padding:11px 12px;border:1px solid #dbe4f3;border-radius:11px;font-family:inherit;font-size:.92rem;margin-bottom:14px}
textarea{resize:vertical;min-height:70px}
.hint{font-size:.75rem;color:var(--muted);margin:-8px 0 14px}
button{border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.88rem}
.btn-add{background:linear-gradient(100deg,var(--pink),var(--blue));color:#fff;width:100%}
.btn-remove{background:none;border:1px solid #f0c8d3;color:var(--pink-dark);padding:5px 10px;font-size:.72rem;border-radius:8px}
.family-row{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:13px 0;border-bottom:1px solid #f1eef2}
.family-row:last-child{border-bottom:0}
.family-name{font-weight:700;color:var(--blue-dark)}
.family-guests{color:var(--muted);font-size:.85rem;margin-top:2px}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:10px 0}
.status-msg{min-height:18px;font-size:.82rem;margin-top:6px}
.status-msg.ok{color:#2f8a55}
.status-msg.err{color:#c1394f}
#lockScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff7fa,#f2f6ff);z-index:100}
.lock-card{width:min(380px,90vw);background:#fff;border-radius:22px;padding:32px 26px;box-shadow:0 20px 50px #6d5d6b1f;text-align:center}
.lock-card h2{font:600 2rem "Cormorant Garamond",serif;color:var(--blue-dark);margin:0 0 6px}
.lock-card p{color:var(--muted);font-size:.85rem;margin:0 0 18px}
.lock-card input{width:100%;padding:12px;border:1px solid #dbe4f3;border-radius:11px;font-size:.9rem;margin-bottom:12px}
.lock-card button{width:100%;border:0;border-radius:11px;padding:12px;font-weight:700;cursor:pointer;background:linear-gradient(100deg,var(--pink),var(--blue));color:#fff}
.lock-msg{min-height:18px;font-size:.8rem;color:#c1394f;margin-top:8px}
#builder{display:none}
</style></head>
<body>

<div id="lockScreen">
  <div class="lock-card">
    <h2>Host access only ♡</h2>
    <p>Enter the admin password to use the guest list builder.</p>
    <input type="password" id="lockPassword" autocomplete="off" placeholder="Password">
    <button id="lockSubmit">Unlock</button>
    <p id="lockMsg" class="lock-msg"></p>
  </div>
</div>

<div id="builder"><div class="wrap">
  <h1>Guest List Builder ♡</h1>
  <p class="sub">Add a family and it saves straight to the live invitation — no file editing needed.</p>

  <div class="card">
    <label for="familyName">Family display name</label>
    <input id="familyName" placeholder="e.g. The Patel Family">
    <label for="guestNames">Guest names</label>
    <textarea id="guestNames" placeholder="One name per line, e.g.&#10;Raj Patel&#10;Priya Patel"></textarea>
    <p class="hint">Each guest can enter the invitation using their own name — no shared login needed.</p>
    <button class="btn-add" id="addFamily">Add to guest list</button>
    <p id="addMsg" class="status-msg"></p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Current guest list</h3>
    <div id="familyList"><p class="empty">Loading…</p></div>
  </div>
</div></div>

<script src="config.js"></script>
<script>
const FUNCTION_URL = SITE_CONFIG.supabaseUrl.replace(".supabase.co","") + ".supabase.co/functions/v1/super-handler";
let adminPassword = null;

async function callFn(payload){
  const res = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

document.getElementById("lockSubmit").addEventListener("click", async()=>{
  const password = document.getElementById("lockPassword").value;
  const msgEl = document.getElementById("lockMsg");
  if(!password){ msgEl.textContent = "Enter the password."; return; }
  msgEl.textContent = "Checking…";
  try{
    await callFn({ password, scope: "verify" });
    adminPassword = password;
    document.getElementById("lockScreen").style.display = "none";
    document.getElementById("builder").style.display = "block";
    loadGuestList();
  }catch(err){
    msgEl.textContent = err.message;
  }
});
document.getElementById("lockPassword").addEventListener("keydown", e=>{
  if(e.key === "Enter") document.getElementById("lockSubmit").click();
});

async function loadGuestList(){
  const listEl = document.getElementById("familyList");
  listEl.innerHTML = '<p class="empty">Loading…</p>';
  try{
    const data = await callFn({ password: adminPassword, scope: "listGuests" });
    const families = {};
    data.guests.forEach(g=>{
      (families[g.family_id] ??= { name: g.family_name, guests: [] }).guests.push(g.guest_name);
    });
    const entries = Object.entries(families);
    if(entries.length === 0){
      listEl.innerHTML = '<p class="empty">No families added yet.</p>';
      return;
    }
    listEl.innerHTML = entries.map(([familyId,f])=>`
      <div class="family-row">
        <div>
          <div class="family-name">${f.name}</div>
          <div class="family-guests">${f.guests.join(", ")}</div>
        </div>
        <button class="btn-remove" data-id="${familyId}">Remove</button>
      </div>
    `).join("");
    listEl.querySelectorAll(".btn-remove").forEach(btn=>{
      btn.addEventListener("click", async()=>{
        if(!confirm(`Remove this whole family from the guest list?`)) return;
        try{
          await callFn({ password: adminPassword, scope: "removeFamily", familyId: btn.dataset.id });
          loadGuestList();
        }catch(err){
          alert(err.message);
        }
      });
    });
  }catch(err){
    listEl.innerHTML = `<p class="empty">${err.message}</p>`;
  }
}

document.getElementById("addFamily").addEventListener("click", async()=>{
  const nameInput = document.getElementById("familyName");
  const guestsInput = document.getElementById("guestNames");
  const msgEl = document.getElementById("addMsg");
  const displayName = nameInput.value.trim();
  const guests = guestsInput.value.split("\n").map(g=>g.trim()).filter(Boolean);

  if(!displayName){ nameInput.focus(); return; }
  if(guests.length === 0){ guestsInput.focus(); return; }

  msgEl.textContent = "Saving…"; msgEl.className = "status-msg";
  try{
    await callFn({ password: adminPassword, scope: "addFamily", displayName, guests });
    msgEl.textContent = "Added ✓"; msgEl.className = "status-msg ok";
    nameInput.value = "";
    guestsInput.value = "";
    nameInput.focus();
    loadGuestList();
  }catch(err){
    msgEl.textContent = err.message; msgEl.className = "status-msg err";
  }
});
</script>
</body></html>
